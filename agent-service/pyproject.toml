[project]
name = "agent-service"
version = "0.1.0"
description = "Turkish e-commerce customer support agent"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "google-genai==2.34.0",
    "httpx==0.28.1",
    "langgraph==1.2.19",
    "langgraph-checkpoint-postgres==3.2.0",
    "pgvector==0.5.1",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "sse-starlette==3.6.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Pulls in torch, so it stays out of the default image.
local-embeddings = ["sentence-transformers==6.2.0"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
