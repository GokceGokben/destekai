# Included in the server block and in every location that sets its own headers: nginx
# drops inherited add_header lines in a location that has any of its own.

# Scripts only from this origin, plus the inline theme script in index.html by its hash.
# If that script changes, its hash must change here too (frontend/src/csp.test.ts checks).
# Styles allow inline: React sets style attributes. Fonts come from Google Fonts and
# product photos from Unsplash; the genie animation draws its snapshot from data: and blob:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-G09vDM2Vcs60HuT7M5/BgrYJCCX9PbGDoJyEZ6MzG6s='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
