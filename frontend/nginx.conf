server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. With the upstream in a variable, nginx resolves it per request instead
    # of at startup, so the page still loads while a backend container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/agent/v1/ {
        set $agent http://agent-service:8000;
        # A variable in proxy_pass disables the prefix replacement, so the path is rewritten.
        rewrite ^/api/agent(/v1/.*)$ $1 break;
        proxy_pass $agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # A buffered stream would reach the browser in one piece.
        proxy_buffering off;
        # Covers the longest LLM retry chain between two events.
        proxy_read_timeout 120s;
    }

    location /api/order/v1/ {
        set $order http://order-api:8080;
        rewrite ^/api/order(/v1/.*)$ $1 break;
        proxy_pass $order;
        # The order API limits failed logins per client address.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Only the latest report, and only for an admin: the order API checks the token.
    location = /reports/latest.json {
        auth_request /_admin_check;
        alias /usr/share/nginx/reports/latest.json;
        add_header Cache-Control "no-store";
    }

    location = /_admin_check {
        internal;
        set $admin_check http://order-api:8080/v1/admin/me;
        proxy_pass $admin_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri /index.html;
    }
}
