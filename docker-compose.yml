services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume keeps database files out of the OneDrive-synced folder.
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  order-api:
    build: ./order-api
    # depends_on is ignored by `docker compose start` and Docker Desktop's Start button,
    # so the API can come up before Postgres accepts connections. It exits then; this
    # retries it.
    restart: on-failure
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Only the order API holds the private key: it is the one service that signs tokens.
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      SEED_DATA: ${SEED_DATA:-true}
      # On by default for the demo; every port is bound to 127.0.0.1.
      DEV_LOGIN: ${DEV_LOGIN:-true}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set in .env}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      PORT: "8080"
    secrets: [jwt_private]
    ports:
      - "127.0.0.1:${ORDER_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once on every `up`. Unchanged chunks are skipped, so restarts spend no quota.
  policy-indexer:
    build: ./agent-service
    entrypoint: ["python", "-m", "app.rag.index"]
    environment: &agent-rag-env
      DATABASE_URL: postgres://destekai_agent:${AGENT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
    volumes:
      - ./docs/policies:/policies:ro
      - ./evals/retrieval:/evals:ro
    depends_on:
      # order-api applies the migrations that create policy_chunks.
      order-api:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    restart: on-failure
    environment:
      <<: *agent-rag-env
      # The agent can verify tokens but never sign one.
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      ORDER_API_URL: http://order-api:8080
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Traces go to Postgres; Langfuse only when both keys are set (off by default).
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK:-}
      PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK:-}
      CHAT_LIMIT_PER_MINUTE: ${CHAT_LIMIT_PER_MINUTE:-20}
      CHAT_LIMIT_PER_DAY: ${CHAT_LIMIT_PER_DAY:-300}
      MEMORY_RETENTION_DAYS: ${MEMORY_RETENTION_DAYS:-30}
    secrets: [jwt_public]
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8000}:8000"
    depends_on:
      policy-indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    # The admin panel reads the latest evaluation report; a new run shows up without a rebuild.
    volumes:
      - ./evals/reports:/usr/share/nginx/reports:ro
    depends_on:
      order-api:
        condition: service_healthy
      agent-service:
        condition: service_healthy

# Created with `make keys` (see README). The folder is git-ignored.
secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

volumes:
  postgres_data:
